<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Steam Media Master Pro</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
      document.documentElement.style.background = '#070f14';
      document.body && (document.body.style.background = '#070f14');
    }
  </script>
  <style>
    html, body { margin:0; padding:0; background:#070f14 !important; color:#e6eef2 !important; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; min-height:100vh; }
    .app { max-width:540px; margin:0 auto; padding:12px; }
    .tabs { display:flex; gap:6px; margin:12px 0; flex-wrap:wrap; }
    .tab { flex:1; min-width:70px; padding:10px 4px; background:#0e1a22; border:1px solid #22373f; color:#8ea3ae; border-radius:8px; font-weight:600; font-size:13px; }
    .tab.active { background:#15262f; color:#e6eef2; border-color:#29b6f6; }
    .tab-content { display:none; }
    .tab-content.active { display:block; }
    .panel { background:#0e1a22; border:1px solid #22373f; border-radius:12px; padding:16px; }
    .file-btn, .action-btn { display:block; width:100%; padding:12px; background:#29b6f6; color:#fff; border:none; border-radius:8px; font-weight:700; text-align:center; margin:8px 0; cursor:pointer; text-decoration:none; }
    .action-btn { background:#ff9800; }
    .preview { min-height:140px; background:#03080b; border:1px solid #22373f; border-radius:8px; margin:10px 0; display:flex; align-items:center; justify-content:center; }
  </style>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1 style="text-align:center;font-size:22px;margin:0 0 8px">Steam Media <span style="color:#29b6f6">Master Pro</span></h1>
      <div id="user-info" style="text-align:center;color:#8ea3ae;font-size:13px"></div>
    </header>
    <div class="tabs">
      <button class="tab active" data-tab="animate">Оживление</button>
      <button class="tab" data-tab="compress">Сжатие</button>
      <button class="tab" data-tab="crop">Нарезка</button>
      <button class="tab" data-tab="templates">Шаблоны</button>
      <button class="tab" data-tab="premium">Премиум ★</button>
    </div>
    <section id="tab-animate" class="tab-content active">
      <div class="panel">
        <h2>Оживить изображение → видео</h2>
        <label class="file-btn">📂 Загрузить изображение
          <input type="file" id="animate-file" accept="image/*" hidden>
        </label>
        <div id="animate-preview" class="preview"></div>
        <div class="controls">
          <label>Нейронка:
            <select id="ai-tool">
              <option value="kling">Kling AI</option>
              <option value="pixverse">PixVerse</option>
              <option value="flow">Google Flow</option>
              <option value="hailuo">Hailuo</option>
              <option value="vidu">Vidu</option>
              <option value="qwen">Qwen</option>
              <option value="grok">Grok</option>
            </select>
          </label>
          <label>Промпт:<textarea id="animate-prompt" rows="5"></textarea></label>
          <button type="button" id="fill-prompt" class="small-btn">Вставить шаблон циклической анимации</button>
        </div>
        <button id="open-ai-btn" class="action-btn">Открыть нейронку и оживить</button>
        <div id="animate-status" class="status"></div>
        <div id="animate-result"></div>
      </div>
    </section>
    <section id="tab-compress" class="tab-content">
      <div class="panel">
        <label class="file-btn">📂 Выбрать GIF / видео
          <input type="file" id="compress-file" accept="image/gif,video/*,image/*" hidden>
        </label>
        <div id="compress-preview" class="preview"></div>
        <div class="controls">
          <label>Макс. размер (МБ): <input type="number" id="max-size" value="5" step="0.5"></label>
          <label>Ширина (px): <input type="number" id="target-width" value="400"></label>
          <label>FPS: <input type="number" id="target-fps" value="12"></label>
          <label>Цветов: <input type="number" id="target-colors" value="128"></label>
        </div>
        <button id="compress-btn" class="action-btn">Сжать</button>
        <div id="compress-status" class="status"></div>
        <div id="compress-result"></div>
      </div>
    </section>
    <section id="tab-crop" class="tab-content">
      <div class="panel">
        <label class="file-btn">📂 Выбрать изображение
          <input type="file" id="crop-file" accept="image/*" hidden>
        </label>
        <div class="crop-controls">
          <label>Main ширина: <input type="number" id="main-w" value="506"></label>
          <label>Side ширина: <input type="number" id="side-w" value="100"></label>
          <label>Смещение Y: <input type="range" id="off-y" min="-200" max="200" value="0"></label>
        </div>
        <canvas id="crop-canvas" class="preview"></canvas>
        <button id="crop-btn" class="action-btn">Нарезать и скачать</button>
        <div id="crop-result"></div>
      </div>
    </section>
    <section id="tab-templates" class="tab-content">
      <div class="panel">
        <h2>Шаблоны рамок и фонов</h2>
        <a href="https://drive.google.com/uc?export=download&id=1K-Wvb_dMwWBU5k7zvymNmM7evCXkSexx" target="_blank" class="action-btn" style="text-decoration:none">⬇ Скачать все шаблоны (.zip)</a>
        <p class="muted">Или выбери отдельный:</p>
        <div class="template-grid" id="template-grid"></div>
      </div>
    </section>
    <section id="tab-premium" class="tab-content">
      <div class="panel">
        <h2>Премиум за звёзды ★</h2>
        <div class="price-card">
          <div class="price-title">Безлимит на 7 дней</div>
          <div class="price-stars">50 ★</div>
          <button class="action-btn buy-btn" data-product="unlimited_7d" data-stars="50">Купить за 50 ★</button>
        </div>
        <div class="price-card">
          <div class="price-title">Безлимит на 30 дней</div>
          <div class="price-stars">150 ★</div>
          <button class="action-btn buy-btn" data-product="unlimited_30d" data-stars="150">Купить за 150 ★</button>
        </div>
        <div class="price-card">
          <div class="price-title">Поддержка автора</div>
          <div class="price-stars">25 ★</div>
          <button class="action-btn buy-btn" data-product="support" data-stars="25">Поддержать 25 ★</button>
        </div>
        <div id="premium-status" class="status"></div>
        <div id="premium-result"></div>
      </div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
